[tool.poetry]
name = "GsChecker"
version = "0.1.0"
description = "Gear checker bot for Warmane"
authors = ["Muzzi Joaquín"]

[tool.poetry.dependencies]
python = "^3.11"
"discord.py" = "^2.0"
requests = "^2.28"
beautifulsoup4 = "^4.11"
python-dotenv = "^1.0"
psycopg = {version = "^3.2", extras = ["binary"]}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.1.0,<27.0.0)"
]
